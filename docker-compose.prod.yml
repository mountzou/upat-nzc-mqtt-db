x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: iot_caddy
    logging: *json-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:15
    container_name: iot_postgres
    logging: *json-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    logging: *json-logging
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  shelly-ingestor:
    build:
      context: ./shelly-ingestor
    container_name: shelly_ingestor
    logging: *json-logging
    restart: on-failure
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_INTERNAL_PORT: ${MQTT_INTERNAL_PORT}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_USE_TLS: ${MQTT_USE_TLS}
      SHELLY_TOPIC: ${SHELLY_TOPIC}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  ttn-ingestor:
    build:
      context: ./ttn-ingestor
    container_name: ttn_ingestor
    logging: *json-logging
    restart: on-failure
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TTN_MQTT_HOST: ${TTN_MQTT_HOST}
      TTN_MQTT_PORT: ${TTN_MQTT_PORT}
      TTN_USERNAME: ${TTN_USERNAME}
      TTN_PASSWORD: ${TTN_PASSWORD}
      TTN_TOPIC: ${TTN_TOPIC}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
    container_name: iot_api
    logging: *json-logging
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      OPS_TELEMETRY_TOKEN: ${OPS_TELEMETRY_TOKEN:?OPS_TELEMETRY_TOKEN is required}
    ports:
      # Staged rollout: remove this public binding only after HTTPS and all
      # downstream callers have been validated through the reverse proxy.
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  energy-aggregator:
    build:
      context: ./energy-aggregator
    container_name: energy_aggregator
    logging: *json-logging
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  simulation-recorder:
    build:
      context: ./simulation-recorder
    container_name: simulation_recorder
    logging: *json-logging
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SIMULATION_API_USERNAME: ${SIMULATION_API_USERNAME:-}
      SIMULATION_API_PASSWORD: ${SIMULATION_API_PASSWORD:-}
      SIMULATION_SCHOOL_IDS: ${SIMULATION_SCHOOL_IDS:-school_3,school_7,school_10,school_13,school_22,school_23}
      SIMULATION_REQUEST_RETRIES: ${SIMULATION_REQUEST_RETRIES:-5}
      SIMULATION_REQUEST_RETRY_DELAY_SECONDS: ${SIMULATION_REQUEST_RETRY_DELAY_SECONDS:-10}
      SIMULATION_REQUEST_MAX_RETRY_DELAY_SECONDS: ${SIMULATION_REQUEST_MAX_RETRY_DELAY_SECONDS:-120}
      SIMULATION_BETWEEN_SCHOOLS_DELAY_SECONDS: ${SIMULATION_BETWEEN_SCHOOLS_DELAY_SECONDS:-15}
    depends_on:
      postgres:
        condition: service_healthy

  pv-prediction:
    build:
      context: ./pv-prediction
    container_name: pv_prediction
    logging: *json-logging
    profiles:
      - jobs
    environment:
      # Optional legacy metadata; excluded from the current RF feature contract.
      PV_LATEST_ACTIVE_POWER_KW: ${PV_LATEST_ACTIVE_POWER_KW:-}
      PV_LAG_1H_KW: ${PV_LAG_1H_KW:-}
      # Active inference and persistence controls.
      PV_NIGHT_GHI_THRESHOLD_WM2: ${PV_NIGHT_GHI_THRESHOLD_WM2:-20.0}
      PV_SAVE_TO_DB: ${PV_SAVE_TO_DB:-true}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  weather-collector:
    build:
      context: ./weather-collector
    container_name: weather_collector
    logging: *json-logging
    profiles:
      - jobs
    environment:
      OPEN_METEO_LATITUDE: ${OPEN_METEO_LATITUDE:-37.068}
      OPEN_METEO_LONGITUDE: ${OPEN_METEO_LONGITUDE:-22.026}
      OPEN_METEO_TIMEZONE: ${OPEN_METEO_TIMEZONE:-Europe/Athens}
      OPEN_METEO_WIND_SPEED_UNIT: ${OPEN_METEO_WIND_SPEED_UNIT:-ms}
      OPEN_METEO_FORECAST_DAYS: ${OPEN_METEO_FORECAST_DAYS:-8}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
