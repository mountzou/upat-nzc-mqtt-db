# PostgreSQL is owned by upat-postgres-volume.service, outside Compose.
# Run the volume preflight before targeted application deployments.
x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: iot_caddy
    networks:
      - default
      - energyplus
    logging: *json-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    logging: *json-logging
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  shelly-ingestor:
    image: sha256:f92a082e0fbbb5cbbd4f3ab922b589df1ca22b403d4f291bbd8f30ace3308d7b
    build:
      context: ./shelly-ingestor
    container_name: shelly_ingestor
    logging: *json-logging
    restart: on-failure
    environment:
      SHELLY_MEASUREMENTS_WRITE_MODE: compact
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_INTERNAL_PORT: ${MQTT_INTERNAL_PORT}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_USE_TLS: ${MQTT_USE_TLS}
      SHELLY_TOPIC: ${SHELLY_TOPIC}
    depends_on:
      mosquitto:
        condition: service_started

  ttn-ingestor:
    image: schoolheroz-time-ttn-ingestor:20260906
    build:
      context: ./ttn-ingestor
    container_name: ttn_ingestor
    logging: *json-logging
    restart: on-failure
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TTN_MQTT_HOST: ${TTN_MQTT_HOST}
      TTN_MQTT_PORT: ${TTN_MQTT_PORT}
      TTN_USERNAME: ${TTN_USERNAME}
      TTN_PASSWORD: ${TTN_PASSWORD}
      TTN_TOPIC: ${TTN_TOPIC}

  api:
    image: sha256:e8fb2d14075b5a0d583bf11f22e8b6c038ecfbdff5ecd8046315e491d5ca2041
    build:
      context: ./api
    container_name: iot_api
    logging: *json-logging
    environment:
      SHELLY_MEASUREMENTS_READ_STORAGE: compact
      SHELLY_MEASUREMENTS_ROUNDING: decimal_1
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      OPS_TELEMETRY_TOKEN: ${OPS_TELEMETRY_TOKEN:?OPS_TELEMETRY_TOKEN is required}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-}
      DATA_SERVICE_TOKEN: ${DATA_SERVICE_TOKEN:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
    ports:
      # Backend callers use authenticated HTTPS; retain loopback for operator checks.
      - "127.0.0.1:8000:8000"

  aggregate-energy:
    image: sha256:c16ade3bf7365c427ef44f261d4fe9a5b06ad3b50e485a58cc3caa01b9d7ffa7
    profiles:
      - jobs
    container_name: aggregate_energy
    logging: *json-logging
    environment:
      # Fixed historical cutover; changing it requires a separate data review.
      SHELLY_COUNTER_START: "2026-09-07T08:00:00+00:00"
      OPEN_METEO_TIMEZONE: ${OPEN_METEO_TIMEZONE:-Europe/Athens}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  simulation-recorder:
    image: nzc-simulation-recorder:vps-20260928
    pull_policy: never
    build:
      context: ./simulation-recorder
    container_name: simulation_recorder
    logging: *json-logging
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SIMULATION_API_BASE_URL: ${SIMULATION_API_BASE_URL:-https://telemetry.schoolheroz.com}
      SIMULATION_API_USERNAME: ${SIMULATION_API_USERNAME:-}
      SIMULATION_API_PASSWORD: ${SIMULATION_API_PASSWORD:-}
      SIMULATION_SCHOOL_IDS: ${SIMULATION_SCHOOL_IDS:-school_3,school_7,school_10,school_13,school_22,school_23}
      SIMULATION_AUTH_TIMEOUT_SECONDS: ${SIMULATION_AUTH_TIMEOUT_SECONDS:-30}
      SIMULATION_CONNECT_TIMEOUT_SECONDS: ${SIMULATION_CONNECT_TIMEOUT_SECONDS:-10}
      SIMULATION_REQUEST_TIMEOUT_SECONDS: ${SIMULATION_REQUEST_TIMEOUT_SECONDS:-600}
      SIMULATION_POLL_INTERVAL_SECONDS: ${SIMULATION_POLL_INTERVAL_SECONDS:-5}
      SIMULATION_POLL_REQUEST_TIMEOUT_SECONDS: ${SIMULATION_POLL_REQUEST_TIMEOUT_SECONDS:-30}
      SIMULATION_POLL_TIMEOUT_SECONDS: ${SIMULATION_POLL_TIMEOUT_SECONDS:-1800}
      SIMULATION_BETWEEN_SCHOOLS_DELAY_SECONDS: ${SIMULATION_BETWEEN_SCHOOLS_DELAY_SECONDS:-15}

  forecast-pv:
    build:
      context: ./jobs/forecast-pv
    container_name: upat-forecast-pv
    logging: *json-logging
    profiles:
      - jobs
    environment:
      # Read the same location and timezone as forecast-weather.
      OPEN_METEO_LATITUDE: ${OPEN_METEO_LATITUDE:-37.068}
      OPEN_METEO_LONGITUDE: ${OPEN_METEO_LONGITUDE:-22.026}
      OPEN_METEO_TIMEZONE: ${OPEN_METEO_TIMEZONE:-Europe/Athens}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  forecast-weather:
    build:
      context: ./jobs/forecast-weather
    container_name: upat-forecast-weather
    logging: *json-logging
    profiles:
      - jobs
    environment:
      OPEN_METEO_LATITUDE: ${OPEN_METEO_LATITUDE:-37.068}
      OPEN_METEO_LONGITUDE: ${OPEN_METEO_LONGITUDE:-22.026}
      OPEN_METEO_TIMEZONE: ${OPEN_METEO_TIMEZONE:-Europe/Athens}
      OPEN_METEO_WIND_SPEED_UNIT: ${OPEN_METEO_WIND_SPEED_UNIT:-ms}
      OPEN_METEO_FORECAST_DAYS: ${OPEN_METEO_FORECAST_DAYS:-8}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

volumes:
  caddy_data:
  caddy_config:

# Reuse the existing application/DB network; Compose must not own its lifecycle.
networks:
  default:
    external: true
    name: upat-nzc-mqtt-db_default
  energyplus:
    external: true
    name: nzc-energyplus
