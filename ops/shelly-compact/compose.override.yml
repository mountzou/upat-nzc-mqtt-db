# Only apply to docker-compose.prod.yml. Both image IDs must be verified locally
# and on the production host before a targeted --no-build --no-deps recreation.
services:
  shelly-ingestor:
    image: ${SHELLY_COMPACT_INGESTOR_IMAGE:?verified immutable image required}
    environment:
      SHELLY_MEASUREMENTS_WRITE_MODE: ${SHELLY_MEASUREMENTS_WRITE_MODE:?explicit write phase required}
  api:
    image: ${SHELLY_COMPACT_API_IMAGE:?verified immutable image required}
    environment:
      SHELLY_MEASUREMENTS_READ_STORAGE: ${SHELLY_MEASUREMENTS_READ_STORAGE:?explicit read phase required}
      SHELLY_MEASUREMENTS_ROUNDING: ${SHELLY_MEASUREMENTS_ROUNDING:?explicit rounding policy required}
